```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE Countdown Hero</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0f1720;
    --card:#18232f;
    --text:#e6edf3;
    --muted:#9fb0c3;
    --green:#7cc5a3;
    --blue:#7aa2f7;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,sans-serif;
    background:var(--bg);
    padding:30px;
}

.jee-banner{
    max-width:1200px;
    margin:auto;

    background:
    linear-gradient(
        135deg,
        #18232f,
        #1b2940,
        #0f1720
    );

    border-radius:32px;
    padding:50px;

    position:relative;
    overflow:hidden;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 20px 60px rgba(0,0,0,.35);
}

.jee-banner::before{
    content:"";
    position:absolute;

    width:500px;
    height:500px;

    right:-180px;
    top:-180px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(124,197,163,.15),
        transparent
    );
}

.tag{
    display:inline-block;

    background:rgba(124,197,163,.12);

    color:var(--green);

    padding:10px 18px;

    border-radius:999px;

    font-size:.9rem;
    font-weight:700;
}

h1{
    margin-top:20px;
    font-size:clamp(2.5rem,6vw,5rem);
    color:white;
    line-height:1;
}

.days{
    color:var(--green);
}

.subtitle{
    margin-top:15px;
    color:var(--muted);
    font-size:1.1rem;
}

.stats{
    margin-top:35px;

    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.stat{
    min-width:150px;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.05);

    border-radius:20px;

    padding:20px;
}

.stat-number{
    font-size:2rem;
    font-weight:800;
    color:var(--blue);
}

.stat-label{
    color:var(--muted);
    margin-top:6px;
}

.quote{
    margin-top:30px;
    font-size:1rem;
    color:var(--green);
    font-weight:600;
}

@media(max-width:768px){

    .jee-banner{
        padding:30px;
    }

    .stats{
        display:grid;
        grid-template-columns:1fr 1fr 1fr;
    }

    .stat{
        min-width:auto;
    }
}
</style>
</head>
<body>

<section class="jee-banner">

    <span class="tag">
        🎯 JEE ADVANCED 2027
    </span>

    <h1>
        <span id="days" class="days">000</span>
        Days Left
    </h1>

    <p class="subtitle">
        Every day you delay, someone else moves ahead.
    </p>

    <div class="stats">

        <div class="stat">
            <div id="hours" class="stat-number">00</div>
            <div class="stat-label">Hours</div>
        </div>

        <div class="stat">
            <div id="minutes" class="stat-number">00</div>
            <div class="stat-label">Minutes</div>
        </div>

        <div class="stat">
            <div id="seconds" class="stat-number">00</div>
            <div class="stat-label">Seconds</div>
        </div>

    </div>

    <div class="quote" id="quote">
        Someone else is studying right now.
    </div>

</section>

<script>

const targetDate =
new Date("May 24, 2027 09:00:00").getTime();

const quotes = [
    "Someone else is studying right now.",
    "Your rank is decided by today's effort.",
    "One chapter today. Thousands of ranks tomorrow.",
    "Comfort now, pressure later.",
    "Future IITian loading...",
    "No zero days."
];

let quoteIndex = 0;

function updateCountdown(){

    const now = new Date().getTime();
    const diff = targetDate - now;

    const days =
    Math.floor(diff / (1000*60*60*24));

    const hours =
    Math.floor(
    (diff % (1000*60*60*24))
    /(1000*60*60)
    );

    const minutes =
    Math.floor(
    (diff % (1000*60*60))
    /(1000*60)
    );

    const seconds =
    Math.floor(
    (diff % (1000*60))
    /1000
    );

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
}

updateCountdown();
setInterval(updateCountdown,1000);

setInterval(()=>{
    quoteIndex = (quoteIndex + 1) % quotes.length;
    document.getElementById("quote").textContent =
    quotes[quoteIndex];
},5000);

</script>

</body>
</html>
